global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    system: nexus

scrape_configs:
  - job_name: nexus-api
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          component: api
  - job_name: nexus-worker
    static_configs:
      - targets: ["host.docker.internal:9092", "host.docker.internal:9093"]
        labels:
          component: worker
  - job_name: nexus-reconciler
    static_configs:
      - targets: ["host.docker.internal:9094"]
        labels:
          component: reconciler
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
