# One ServiceAccount per component rather than a shared one. NEXUS talks to the cluster
# API from the reconciler (drift detection) and eventually from the worker (preview envs),
# so keeping identities separate means we can bind narrow RBAC later without widening it
# for the API and the web console at the same time.
#
# automountServiceAccountToken is off everywhere except the reconciler: the API, worker and
# web console have no reason to hold a projected cluster token, and an unused token in the
# pod filesystem is just credential surface for anything that gets RCE on those containers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-worker
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-reconciler
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: reconciler
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/managed-by: kustomize
# The reconciler is the one component that reads cluster state to detect drift, so it is
# the only one that keeps its token. Bind it to a read-mostly Role in your own overlay.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-web
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
