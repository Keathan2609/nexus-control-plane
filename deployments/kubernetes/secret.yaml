# ---------------------------------------------------------------------------------------
# TEMPLATE ONLY - THIS FILE MUST NEVER BE COMMITTED WITH REAL VALUES.
#
# Every value below is a placeholder. Applying this as-is produces a Secret that will not
# authenticate against anything, which is the intended failure mode: a pod that cannot
# reach the database is a much better outcome than a pod running on a credential that
# leaked through git history.
#
# How this is meant to be filled in, in rough order of preference:
#
#   1. External Secrets Operator / Vault / cloud secret manager. Delete this file from
#      kustomization.yaml and let an ExternalSecret materialise `nexus-secrets` instead.
#      This is what production should do.
#   2. Sealed Secrets. Encrypt with kubeseal and commit the SealedSecret, not this.
#   3. Out-of-band generation at bootstrap, e.g.
#        kubectl -n nexus create secret generic nexus-secrets \
#          --from-literal=NEXUS_DATABASE_URL="postgres://..." \
#          --from-literal=NEXUS_AUTH_JWT_SECRET="$(openssl rand -base64 48)" \
#          --from-literal=NEXUS_WEBHOOK_SECRET="$(openssl rand -hex 32)"
#      then drop this file from the kustomization so a later `apply -k` cannot clobber it.
#
# stringData (not data) is used so the placeholders stay human-readable and nobody is
# tempted to paste a base64 blob in and call it obscured - base64 is not encryption.
# ---------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/managed-by: kustomize
  annotations:
    nexus.dev/placeholder: "true"
    nexus.dev/rotation-policy: "JWT and webhook secrets rotate quarterly; DB credential on lease expiry"
type: Opaque
stringData:
  # PostgreSQL 16 DSN. sslmode=require at minimum; prefer verify-full with a mounted CA.
  NEXUS_DATABASE_URL: "REPLACE_ME__postgres://USER:PASSWORD@HOST:5432/nexus?sslmode=require"
  # Symmetric signing key for console/API sessions. 32+ bytes of CSPRNG output.
  NEXUS_AUTH_JWT_SECRET: "REPLACE_ME__generate_with_openssl_rand_base64_48"
  # Shared secret for inbound SCM webhook HMAC verification.
  NEXUS_WEBHOOK_SECRET: "REPLACE_ME__generate_with_openssl_rand_hex_32"
