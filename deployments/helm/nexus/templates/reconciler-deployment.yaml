apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" "reconciler") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # ---------------------------------------------------------------------------------------
  # replicas: 1 and strategy: Recreate. Both are hardcoded, not values. Read before changing.
  #
  # The reconciler is a singleton control loop: it reaps expired job leases, detects drift
  # and expires preview environments. Two copies race. Both see the same expired lease and
  # both act on it, so a job gets handed to two workers, or a preview environment is torn
  # down while a second loop is still reconciling it. These are silent correctness bugs, not
  # crashes - you find them days later as duplicated pipeline runs.
  #
  # The proper fix is leader election (a coordination.k8s.io Lease), which this component
  # does not implement yet. Until it does, "one replica + Recreate" IS the mutual exclusion
  # mechanism, and both halves are load-bearing:
  #
  #   - replicas: 1 keeps steady state at one.
  #   - Recreate keeps ROLLOUTS at one. RollingUpdate would start the new pod before the old
  #     one terminated and hand us exactly the overlap we are trying to prevent - a brief
  #     window is all it takes, because lease reaping runs on a short tick.
  #
  # The cost is a few seconds with no reconciler during an upgrade. That is fine: a control
  # loop that misses ten seconds catches up on its next tick. Availability is simply not the
  # binding constraint here, correctness is.
  #
  # These are hardcoded rather than exposed as values precisely so that "scale it up for
  # high availability" cannot be done by editing a values file. It would not improve
  # availability; it would corrupt state.
  # ---------------------------------------------------------------------------------------
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "nexus.componentSelectorLabels" (dict "root" $ "component" "reconciler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.componentLabels" (dict "root" $ "component" "reconciler") | nindent 8 }}
        nexus.dev/database-client: "true"
        nexus.dev/nats-client: "true"
        {{- with .Values.reconciler.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "nexus.metricsAnnotations" . | nindent 8 }}
        {{- with .Values.reconciler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nexus.serviceAccountName" (dict "root" $ "component" "reconciler") }}
      # The one component that reads live cluster state for drift detection, so the one
      # component that keeps its projected token.
      automountServiceAccountToken: true
      {{- include "nexus.imagePullSecrets" . | nindent 6 }}
      # Short by design. The loop works in idempotent ticks; interrupting one costs a redo
      # on the next tick. A long grace period here only widens the single-instance gap
      # during a Recreate rollout, which is the one thing this component trades away.
      terminationGracePeriodSeconds: {{ .Values.reconciler.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.reconciler.podSecurityContext | nindent 8 }}
      {{- with .Values.reconciler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reconciler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reconciler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reconciler
          image: {{ include "nexus.image" (dict "root" $ "image" .Values.reconciler.image) }}
          imagePullPolicy: {{ .Values.reconciler.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            {{- include "nexus.envFrom" . | nindent 12 }}
          env:
            - name: NEXUS_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Only /healthz is exposed, so readiness reuses it. With one replica and
            # Recreate, this is what makes `kubectl rollout status` mean anything.
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Small on purpose. This loop wakes, runs a handful of queries, and sleeps. If
            # it ever needs more than this, something has become a batch job and belongs in
            # the worker instead.
            {{- toYaml .Values.reconciler.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.reconciler.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-reconciler-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" "reconciler") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "nexus.componentSelectorLabels" (dict "root" $ "component" "reconciler") | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
