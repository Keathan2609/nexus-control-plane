apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
  annotations:
    # Wave 2, last. The console is the only component that depends on another NEXUS
    # component at startup, and rolling it after the API means a user who reloads mid-deploy
    # gets a console talking to an API that is already on the new version, rather than a new
    # console calling endpoints the old API does not serve yet.
    argocd.argoproj.io/sync-wave: "2"
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  # Same reasoning as the API: user-facing, so never dip below the declared replica count
  # during a rollout. Holding one surge pod is cheaper than explaining a blank console.
  strategy:
    {{- toYaml .Values.web.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "nexus.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.componentLabels" (dict "root" $ "component" "web") | nindent 8 }}
        # Note what is absent: nexus.dev/database-client. The console reaches the system of
        # record only through the API, and the NetworkPolicy enforces that rather than
        # trusting the frontend to behave.
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nexus.serviceAccountName" (dict "root" $ "component" "web") }}
      automountServiceAccountToken: false
      {{- include "nexus.imagePullSecrets" . | nindent 6 }}
      # Plain request/response with no long-lived streams of its own - the console opens SSE
      # against the API, not against this process - so a short drain is enough.
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "nexus.topologySpreadConstraints" (dict "root" $ "component" "web" "constraints" .) | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "nexus.image" (dict "root" $ "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Server-side rendering calls the API Service directly. In-cluster, so it does
            # not hairpin back out through the ingress and does not depend on external DNS.
            - name: NEXUS_API_URL
              value: "http://{{ include "nexus.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          # Next.js ships no dedicated health endpoint, so probes hit the app root. That is
          # a heavier check than a purpose-built /healthz, hence the longer timeouts. If the
          # console grows an /api/health route, point these at it and tighten these numbers.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.web.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.web.preStopSleepSeconds }}
          {{- end }}
          resources:
            # Node is memory-hungry and largely single-threaded per request, so the memory
            # limit is the one that actually bites. The CPU limit mostly bounds render
            # bursts on cold pages.
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # Next.js writes ISR output and image-optimizer results under .next/cache at
        # runtime. Without a writable mount here, readOnlyRootFilesystem turns every
        # optimized image request into a 500. Per-pod and ephemeral is fine: a cold cache
        # costs first-render latency, not correctness.
        - name: next-cache
          emptyDir:
            sizeLimit: {{ .Values.web.cache.sizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    {{- with .Values.web.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "nexus.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
