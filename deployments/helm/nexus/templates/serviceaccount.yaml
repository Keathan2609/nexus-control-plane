{{- if .Values.serviceAccount.create }}
{{- range $component := list "api" "worker" "reconciler" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexus.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    # Wave -5: identity exists before anything that references it. Argo CD will not start
    # syncing wave -3 (dependencies) until every object in -5 is healthy.
    argocd.argoproj.io/sync-wave: "-5"
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Only the reconciler keeps a projected cluster token - it is the component that reads live
# cluster state for drift detection. The API, worker and console have no business talking to
# the Kubernetes API, and an unused token sitting in the pod filesystem is credential
# surface for anything that gets code execution in those containers.
automountServiceAccountToken: {{ eq $component "reconciler" }}
{{- end }}
{{- end }}
