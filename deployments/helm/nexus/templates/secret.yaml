{{- if .Values.secrets.create }}
{{/*
Rendered only when secrets.create=true, which is NOT the default.

Be aware of what this does: values passed with --set or a values file end up stored in the
Helm release Secret in the cluster, in your shell history, and in your CI logs if the
pipeline echoes its arguments. That is acceptable for a laptop cluster and not acceptable
for anything else. The default path (secrets.create=false + an externally managed Secret,
ideally materialised by External Secrets Operator or Sealed Secrets) exists because it
keeps credentials out of the release object entirely.

`required` rather than a default: an empty JWT signing key is worse than a failed install,
because it fails open. Better to break the render than to sign sessions with "".
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus.componentLabels" (dict "root" $ "component" "config") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
type: Opaque
stringData:
  NEXUS_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  NEXUS_AUTH_JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true - generate with: openssl rand -base64 48" .Values.secrets.jwtSecret | quote }}
  NEXUS_WEBHOOK_SECRET: {{ required "secrets.webhookSecret is required when secrets.create=true - generate with: openssl rand -hex 32" .Values.secrets.webhookSecret | quote }}
{{- end }}
