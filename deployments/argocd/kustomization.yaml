# Bootstrap kustomization for the Argo CD side.
#
#   kubectl apply -k deployments/argocd
#
# Ordering matters on a first install: the AppProject must exist before the Application
# that references it, or Argo rejects the Application with "project nexus does not exist".
# Listing appproject.yaml first is enough - kustomize preserves resource order and kubectl
# applies in that order.
#
# This is the one manual `kubectl apply` in the whole story. Everything after it is pulled
# from Git by Argo. If you run an app-of-apps pattern, fold these two into that root
# Application instead and there is no manual step at all.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: nexus-argocd

# Argo CD reads Application and AppProject objects from its own namespace, not from the
# namespace the workloads land in. spec.destination.namespace controls where NEXUS is
# deployed; this controls where the control objects live.
namespace: argocd

resources:
  - appproject.yaml
  - application.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: nexus
      app.kubernetes.io/managed-by: argocd
