name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  checks: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0a12454c4081eb480fe779abc71eb1e319ec5014 # v6.0.1
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c050581fe422a3a # v6.1.0
        with:
          version: latest
          args: --timeout=10m

      - name: Build all packages
        run: go build ./...

  go-test:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0

      - name: Set up Go
        uses: actions/setup-go@0a12454c4081eb480fe779abc71eb1e319ec5014 # v6.0.1
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f86d3ef # v4.5.0
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1

  go-integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      nats:
        image: nats:2.10-alpine
        options: >-
          -js
          --health-cmd "nats --server nats://127.0.0.1:4222 server info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 4222:4222

    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0

      - name: Set up Go
        uses: actions/setup-go@0a12454c4081eb480fe779abc71eb1e319ec5014 # v6.0.1
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        env:
          NEXUS_TEST_DATABASE_URL: postgres://postgres@localhost:5432/nexus_test?sslmode=disable
          NEXUS_TEST_NATS_URL: nats://localhost:4222
        run: go test -v -race -tags=integration ./...

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b33de1b3b56f41 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linter
        working-directory: web
        run: npm run lint

      - name: Run type check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Run tests
        working-directory: web
        run: npm test

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Narrower than the workflow default: this job reads the repository and reports.
    # It has no reason to write checks or upload SARIF.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0
        with:
          # Secret scanning needs the history, not just the tip. A credential removed
          # in the latest commit is still published if it is reachable from any earlier
          # one, and a shallow clone cannot see that.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0a12454c4081eb480fe779abc71eb1e319ec5014 # v6.0.1
        with:
          go-version: '1.27'

      # The module is published as golang.org/x/vuln. Installing it by its GitHub
      # mirror path fails outright ("module declares its path as: golang.org/x/vuln"),
      # which is what this step used to do — so it never actually scanned anything.
      # Deliberately unpinned: a vulnerability scanner is only useful at its newest.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Set up Node.js for npm audit
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b33de1b3b56f41 # v5.0.0
        with:
          node-version: '20'

      # No continue-on-error. The console is at zero advisories, so a new one is a
      # regression and should stop the build rather than scroll past in a log.
      - name: Run npm audit on web
        working-directory: web
        run: npm audit --audit-level=moderate

      # Scans the whole history on every push and pull request, so a credential can
      # never reach the default branch unnoticed. .gitleaks.toml records the single
      # known false positive with its reasoning rather than disabling the rule.
      # Installed from source rather than through the marketplace action, which for
      # organisations requires a licence key. Go is already set up on this runner, so
      # this costs one build and keeps the job dependency-free.
      - name: Scan git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        image:
          - nexus-api
          - nexus-worker
          - nexus-reconciler
          - nexus-web
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b664c736549414585f9199f33b47101d30 # v3.7.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed529a34b6c35d6a2b02ee1 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (main) or build only (PR)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.9.0
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image == 'nexus-web' && 'web' || matrix.image == 'nexus-api' && 'api' || matrix.image == 'nexus-worker' && 'worker' || 'reconciler' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@6e7b7d1ac3245b51569f33e22623ad82ac73ff103 # v0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: ${{ matrix.image }}-trivy.sarif

      - name: Upload Trivy results to Security tab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@6e757fb10c2c5dbecc1c1eb30b4c9de1ab2d18fc # v3.27.0
        with:
          sarif_file: ${{ matrix.image }}-trivy.sarif
          category: trivy-${{ matrix.image }}

      - name: Generate SBOM with syft
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@d94f46e4b415d7bfd221eea2e6ba89db4b91d701 # v0.17.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: ${{ matrix.image }}-sbom.json

      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f86d3ef # v4.5.0
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}-sbom.json
          retention-days: 30

  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - go-checks
      - go-test
      - go-integration
      - web
      - security
      - build-images
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.go-checks.result }}" != "success" || \
                "${{ needs.go-test.result }}" != "success" || \
                "${{ needs.go-integration.result }}" != "success" || \
                "${{ needs.web.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" || \
                "${{ needs.build-images.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
