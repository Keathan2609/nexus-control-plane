name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Read-only by default. The one job that needs to write security events (uploading
# Trivy SARIF) grants itself that scope, so nothing else inherits it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than "latest": a linter that updates itself turns an unrelated
          # push into a red build. This version is the one verified against Go 1.27 —
          # older releases cannot read its export data and fail before linting anything.
          # Everything else, including the timeout, comes from .golangci.yml so that a
          # local run and CI agree.
          version: v2.13.2

      - name: Build all packages
        run: go build ./...

  go-test:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1

  go-integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        env:
          NEXUS_TEST_DATABASE_URL: postgres://postgres@localhost:5432/nexus_test?sslmode=disable
        run: go test -v -race -tags=integration ./...

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linter
        working-directory: web
        run: npm run lint

      - name: Run type check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Run tests
        working-directory: web
        run: npm test

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Narrower than the workflow default: this job reads the repository and reports.
    # It has no reason to write checks or upload SARIF.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning needs the history, not just the tip. A credential removed
          # in the latest commit is still published if it is reachable from any earlier
          # one, and a shallow clone cannot see that.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      # The module is published as golang.org/x/vuln. Installing it by its GitHub
      # mirror path fails outright ("module declares its path as: golang.org/x/vuln"),
      # which is what this step used to do — so it never actually scanned anything.
      # Deliberately unpinned: a vulnerability scanner is only useful at its newest.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Set up Node.js for npm audit
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # No continue-on-error. The console is at zero advisories, so a new one is a
      # regression and should stop the build rather than scroll past in a log.
      - name: Run npm audit on web
        working-directory: web
        run: npm audit --audit-level=moderate

      # Scans the whole history on every push and pull request, so a credential can
      # never reach the default branch unnoticed. .gitleaks.toml records the single
      # known false positive with its reasoning rather than disabling the rule.
      # Installed from source rather than through the marketplace action, which for
      # organisations requires a licence key. Go is already set up on this runner, so
      # this costs one build and keeps the job dependency-free.
      - name: Scan git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # One matrix member's failure must not hide the other three. Trivy finding a real
      # HIGH/CRITICAL in the reconciler image says nothing about whether the API, worker
      # or web images are also affected, and the default fail-fast cancels them before
      # they can answer that. Turning it off costs nothing when every leg is healthy and
      # gives the complete picture the one time it is not.
      fail-fast: false
      matrix:
        image:
          - nexus-api
          - nexus-worker
          - nexus-reconciler
          - nexus-web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The one canonical image identity every later step scans, builds and records
      # against. GitHub Container Registry rejects uppercase in a repository path — the
      # OCI reference spec requires lowercase — and github.repository_owner is the
      # account's display case ("Keathan2609"), not normalised. docker/metadata-action
      # lowercases automatically for its own tags; Trivy and Syft do not, because they
      # were never told to build the reference themselves in the first place. They were
      # reconstructing it independently from the raw, uppercase owner, which produced a
      # reference Trivy's own parser rejected before it ever tried to reach the
      # registry: "could not parse reference: ghcr.io/Keathan2609/nexus-reconciler:...".
      # Resolving it once here and threading it through removes the second copy that
      # could disagree with the first.
      - name: Resolve canonical image repository
        id: image
        run: |
          echo "repository=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (main) or build only (PR)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image == 'nexus-web' && 'web' || matrix.image == 'nexus-api' && 'api' || matrix.image == 'nexus-worker' && 'worker' || 'reconciler' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # image@digest, not image:tag. A tag can move; this build's own content-addressed
      # digest cannot, so it is the one reference guaranteed to name exactly what was
      # just built and pushed rather than whatever a tag happens to point at by the time
      # the scanner runs.
      - name: Run Trivy vulnerability scan
        id: trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: ${{ matrix.image }}-trivy.sarif
          severity: HIGH,CRITICAL
          # A HIGH or CRITICAL finding fails this step, and nothing here catches that
          # failure — it propagates to the job and then to the success gate. The SARIF
          # upload and SBOM steps below still run: enforcement failing is not a reason
          # to also discard the report that says why.
          exit-code: '1'

      - name: Upload Trivy results to Security tab
        # !cancelled() rather than always(): still runs after Trivy fails on a genuine
        # finding, so the result reaches the Security tab instead of being discarded
        # with the step that found it. Skips only if the job itself was cancelled, when
        # there is nothing to upload.
        if: >-
          !cancelled() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ matrix.image }}-trivy.sarif
          category: trivy-${{ matrix.image }}

      - name: Generate SBOM with syft
        if: >-
          !cancelled() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.image }}-sbom.json

      - name: Upload SBOM artifact
        if: >-
          !cancelled() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}-sbom.json
          retention-days: 30

  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - go-checks
      - go-test
      - go-integration
      - web
      - security
      - build-images
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.go-checks.result }}" != "success" || \
                "${{ needs.go-test.result }}" != "success" || \
                "${{ needs.go-integration.result }}" != "success" || \
                "${{ needs.web.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" || \
                "${{ needs.build-images.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed successfully"
