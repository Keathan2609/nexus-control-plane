name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image:
          - nexus-api
          - nexus-worker
          - nexus-reconciler
          - nexus-web
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image == 'nexus-web' && 'web' || matrix.image == 'nexus-api' && 'api' || matrix.image == 'nexus-worker' && 'worker' || 'reconciler' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: ${{ matrix.image }}-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}-sbom.json
          retention-days: 90

  build-cli-binaries:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows on ARM64 is not commonly used; exclude to save build time
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LDFLAGS: -X github.com/Keathan2609/nexus/internal/build.Version=${{ steps.version.outputs.version }}
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then
            suffix=".exe"
          fi
          go build -ldflags "$LDFLAGS" -o nexus-${{ matrix.goos }}-${{ matrix.goarch }}${suffix} ./cmd/nexus

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nexus-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-images
      - build-cli-binaries
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          # Release ${{ steps.version.outputs.version }}

          ## Container Images

          Multi-architecture Docker images (linux/amd64, linux/arm64) have been published to GHCR:

          - `ghcr.io/${{ github.repository_owner }}/nexus-api:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-worker:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-reconciler:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-web:${{ steps.version.outputs.version }}`

          ## CLI Binaries

          Pre-compiled binaries for the `nexus` CLI are available below.

          ### Usage
          Download the binary for your platform, make it executable (on Linux/macOS), and run it.

          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          files: cli-binary-*/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
