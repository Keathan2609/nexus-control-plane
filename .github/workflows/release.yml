name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image:
          - nexus-api
          - nexus-worker
          - nexus-reconciler
          - nexus-web
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b664c736549414585f9199f33b47101d30 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed529a34b6c35d6a2b02ee1 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.9.0
        with:
          context: .
          file: deployments/docker/Dockerfile.${{ matrix.image == 'nexus-web' && 'web' || matrix.image == 'nexus-api' && 'api' || matrix.image == 'nexus-worker' && 'worker' || 'reconciler' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM with syft
        uses: anchore/sbom-action@d94f46e4b415d7bfd221eea2e6ba89db4b91d701 # v0.17.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: ${{ matrix.image }}-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f86d3ef # v4.5.0
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}-sbom.json
          retention-days: 90

  build-cli-binaries:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows on ARM64 is not commonly used; exclude to save build time
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15079f37a30b06314 # v4.2.0

      - name: Set up Go
        uses: actions/setup-go@0a12454c4081eb480fe779abc71eb1e319ec5014 # v6.0.1
        with:
          go-version: '1.27'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LDFLAGS: -X github.com/Keathan2609/nexus/internal/build.Version=${{ steps.version.outputs.version }}
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then
            suffix=".exe"
          fi
          go build -ldflags "$LDFLAGS" -o nexus-${{ matrix.goos }}-${{ matrix.goarch }}${suffix} ./cmd/nexus

      - name: Upload binary artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f86d3ef # v4.5.0
        with:
          name: cli-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nexus-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-images
      - build-cli-binaries
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@65a9edc5881444af0b3872cd0e7169dbaa51a055 # v4.1.7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          # Release ${{ steps.version.outputs.version }}

          ## Container Images

          Multi-architecture Docker images (linux/amd64, linux/arm64) have been published to GHCR:

          - `ghcr.io/${{ github.repository_owner }}/nexus-api:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-worker:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-reconciler:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository_owner }}/nexus-web:${{ steps.version.outputs.version }}`

          ## CLI Binaries

          Pre-compiled binaries for the `nexus` CLI are available below.

          ### Usage
          Download the binary for your platform, make it executable (on Linux/macOS), and run it.

          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3b1df79740e2c3e0 # v2.0.4
        with:
          body_path: release_notes.md
          files: cli-binary-*/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
